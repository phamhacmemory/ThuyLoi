services:
  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      DB_PATH: /app/data/telemetry.sqlite
      DEVICES_FILE: /app/config/devices.json
      WATER_FILE: /app/config/water.geojson
      GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY:-}
      MAP_MAX_AGE_MIN: ${MAP_MAX_AGE_MIN:-15}
      MAP_MAX_SKEW_MIN: ${MAP_MAX_SKEW_MIN:-5}
      MAP_MAX_GAP_M: ${MAP_MAX_GAP_M:-2000}
      DEVICE_ONLINE_MIN: ${DEVICE_ONLINE_MIN:-3}
    volumes:
      - telemetry:/app/data
      - ../config:/app/config:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-443}:443"
    environment:
      CADDY_SITE: ${CADDY_SITE:?Set CADDY_SITE in deploy/.env}
      DASHBOARD_USER: ${DASHBOARD_USER:?Set DASHBOARD_USER in deploy/.env}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:?Set DASHBOARD_PASSWORD_HASH in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  telemetry:
  caddy_data:
  caddy_config:
